general {
    hide_cursor = true
    ignore_empty_input = true
}

auth {
    fingerprint:enabled = false
}

background {
    monitor =
    path = ~/.config/hypr/wallpaper.jpg
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
    vibrancy = 0.2
}

# Time
label {
    monitor =
    text = $TIME
    font_family = Inter Bold
    font_size = 96
    color = rgba(f2f2f2ee)
    position = 0, 160
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_family = Inter
    font_size = 20
    color = rgba(f2f2f2bb)
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    rounding = 14
    dots_size = 0.25
    dots_spacing = 0.3
    inner_color = rgba(1a1a1a99)
    font_color = rgba(f2f2f2ff)
    outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    check_color = rgba(00ff99ee)
    fail_color = rgba(f38ba8ee)
    fail_text = $FAIL ($ATTEMPTS)
    placeholder_text = Password
    fade_on_empty = false
    font_family = Inter
    position = 0, -40
    halign = center
    valign = center
}
